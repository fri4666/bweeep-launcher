plugins {
    id "java"
    id "com.gradleup.shadow" version "9.2.2"
}

group = "com.bweeep"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.ow2.asm:asm:9.8"
    testImplementation "io.netty:netty-transport:4.1.115.Final"
}

// Java 8 bytecode, so the agent loads on every Minecraft runtime (Java 8 to 25).
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = "UTF-8"
    options.compilerArgs += ["-Xlint:-options"]
}

shadowJar {
    archiveBaseName = "bweeep-guard"
    // The launcher pins the jar's hash, so a rebuild must give the same bytes.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    archiveClassifier = ""
    // Forge and NeoForge ship their own ASM; ours must never be mistaken for it.
    relocate "org.objectweb.asm", "com.bweeep.guard.shaded.asm"
    exclude "module-info.class", "META-INF/versions/**", "META-INF/maven/**"
    manifest {
        attributes(
            "Premain-Class": "com.bweeep.guard.GuardAgent",
            "Can-Retransform-Classes": "true",
            "Implementation-Version": project.version
        )
    }
}

tasks.named("jar") { enabled = false }
tasks.named("assemble") { dependsOn shadowJar }

// A plain-Java check against a real Netty Bootstrap, run with the built agent.
tasks.register("verifyAgent", JavaExec) {
    dependsOn shadowJar, testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.bweeep.guard.AgentCheck"
    jvmArgs = ["-javaagent:${tasks.shadowJar.archiveFile.get().asFile}", "-Dbweeep.targetServer=127.0.0.1:25599"]
}
