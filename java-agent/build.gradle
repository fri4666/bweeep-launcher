plugins {
    id "java"
    id "com.gradleup.shadow" version "9.2.2"
}

group = "com.bweeep"
version = "1.1.1"

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.ow2.asm:asm:9.8"
    testImplementation "io.netty:netty-transport:4.1.115.Final"
}

// Java 8 bytecode, so the agent loads on every Minecraft runtime (Java 8 to 25).
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = "UTF-8"
    options.compilerArgs += ["-Xlint:-options"]
}

shadowJar {
    archiveBaseName = "bweeep-guard"
    // The launcher pins the jar's hash, so a rebuild must give the same bytes.
    // javac output differs a little between JDKs; the shipped jar is built with JDK 25, as in CI.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    archiveClassifier = ""
    // Forge and NeoForge ship their own ASM; ours must never be mistaken for it.
    relocate "org.objectweb.asm", "com.bweeep.guard.shaded.asm"
    exclude "module-info.class", "META-INF/versions/**", "META-INF/maven/**"
    manifest {
        attributes(
            "Premain-Class": "com.bweeep.guard.GuardAgent",
            "Can-Retransform-Classes": "true",
            "Implementation-Version": project.version
        )
    }
}

tasks.named("jar") { enabled = false }
tasks.named("assemble") { dependsOn shadowJar }

// Plain-Java checks against a real Netty Bootstrap, run with the built agent.
def agentCheck = { String name, String main, List<String> properties ->
    tasks.register(name, JavaExec) {
        dependsOn shadowJar, testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = main
        jvmArgs = ["-javaagent:${tasks.shadowJar.archiveFile.get().asFile}"] + properties
    }
}
agentCheck("verifyAgent", "com.bweeep.guard.AgentCheck", ["-Dbweeep.targetServer=127.0.0.1:25599"])
agentCheck("verifyLeave", "com.bweeep.guard.LeaveCheck", ["-Dbweeep.targetServer=127.0.0.1:25598"])
agentCheck("verifyExitOnLeave", "com.bweeep.guard.ExitCheck", ["-Dbweeep.targetServer=127.0.0.1:25597", "-Dbweeep.exitOnLeave=true"])
agentCheck("verifyIntermediaryExit", "com.bweeep.guard.GracefulExitCheck", ["-Dbweeep.targetServer=127.0.0.1:25594", "-Dbweeep.exitOnLeave=true", "-Dbweeep.fixture=net.minecraft.class_310"])
agentCheck("verifyNamedExit", "com.bweeep.guard.GracefulExitCheck", ["-Dbweeep.targetServer=127.0.0.1:25593", "-Dbweeep.exitOnLeave=true", "-Dbweeep.fixture=net.minecraft.client.MinecraftClient"])
agentCheck("verifyMojmapExit", "com.bweeep.guard.GracefulExitCheck", ["-Dbweeep.targetServer=127.0.0.1:25592", "-Dbweeep.exitOnLeave=true", "-Dbweeep.fixture=net.minecraft.client.Minecraft"])
agentCheck("verifyExitWatchdog", "com.bweeep.guard.GracefulExitCheck", ["-Dbweeep.targetServer=127.0.0.1:25591", "-Dbweeep.exitOnLeave=true", "-Dbweeep.fixture=net.minecraft.class_310", "-Dbweeep.fixtureHang=true"])
tasks.named("check") { dependsOn "verifyIntermediaryExit", "verifyNamedExit", "verifyMojmapExit", "verifyExitWatchdog" }

// The checks are plain mains, not JUnit tests; `gradlew build` runs them through check.
tasks.named("test") { failOnNoDiscoveredTests = false }
tasks.named("check") { dependsOn "verifyAgent", "verifyLeave", "verifyExitOnLeave" }
