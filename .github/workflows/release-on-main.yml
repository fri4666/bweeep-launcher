name: 런처 릴리스

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 이미 게시한 버전인지 확인
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "test_tag=v$version-test.1" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT
          exit 0

      # 버전을 올릴 때 노트도 함께 고치도록, 첫 줄이 새 버전이 아니면 게시하지 않습니다.
      - name: 릴리스 노트 확인
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        run: |
          $expected = 'v${{ steps.version.outputs.version }}'
          $first = (Get-Content build/release-notes.txt -TotalCount 1 -Encoding utf8).Trim()
          if ($first -ne $expected) {
            throw "build/release-notes.txt 첫 줄이 $expected 이어야 합니다. 지금은 '$first'입니다."
          }

      - name: 의존성 및 회귀 검사
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm run verify:deep-link
          npm run verify:launch-identity

      - name: Windows 설치본 만들기
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        run: |
          npm run package:win -- --publish never
          npm run package:win:test -- --publish never

      - name: GitHub 테스트 릴리스 게시
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.test_tag }}'
          $assets = @(
            "release-installer-test/Bweeep-Test-Setup-$version.exe",
            "release-installer-test/Bweeep-Test-Setup-$version.exe.blockmap",
            "release-installer-test/test.yml"
          )
          $notes = "지정 테스터용 테스트 런처입니다. 확인이 끝나면 같은 변경을 정식판으로 배포합니다.`n`n" + (Get-Content build/release-notes.txt -Raw -Encoding utf8)
          $notesFile = Join-Path $env:RUNNER_TEMP "test-release-notes.txt"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease --title "붸에엡 테스트 v$version" --notes-file $notesFile
          } else {
            gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "붸에엡 테스트 v$version" --notes-file $notesFile
          }

      # 정식판은 초안으로만 올립니다. 초안은 자동 업데이트에 보이지 않으므로,
      # 테스터가 테스트판을 확인한 뒤 "정식 배포" 워크플로로 게시합니다.
      - name: GitHub 정식 릴리스 초안 올리기
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create $tag `
            "release-installer/Bweeep-Setup-$version.exe" `
            "release-installer/Bweeep-Setup-$version.exe.blockmap" `
            "release-installer/latest.yml" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --draft `
            --title "붸에엡 v$version" `
            --notes-file build/release-notes.txt
