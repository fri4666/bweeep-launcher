name: 런처 릴리스

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 정식판이 이미 게시된 버전이면 아무것도 하지 않습니다. 초안만 있으면
      # (테스트 중이면) 병합할 때마다 새 테스트판을 내고 초안도 새로 만듭니다.
      - name: 게시 상태 확인
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $PSNativeCommandUseErrorActionPreference = $false
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          $published = $LASTEXITCODE -eq 0 -and $draft -eq "false"
          $hasDraft = $LASTEXITCODE -eq 0 -and $draft -eq "true"
          $tests = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName --jq ".[].tagName" | Where-Object { $_ -like "$tag-test.*" })
          $next = 1 + ($tests | ForEach-Object { [int]($_ -replace "^.*-test\.", "") } | Measure-Object -Maximum).Maximum
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "test_build=$next" >> $env:GITHUB_OUTPUT
          "test_tag=$tag-test.$next" >> $env:GITHUB_OUTPUT
          "published=$published" >> $env:GITHUB_OUTPUT
          "has_draft=$hasDraft" >> $env:GITHUB_OUTPUT
          exit 0

      # 버전을 올릴 때 노트도 함께 고치도록, 첫 줄이 새 버전이 아니면 게시하지 않습니다.
      - name: 릴리스 노트 확인
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        run: |
          $expected = 'v${{ steps.version.outputs.version }}'
          $first = (Get-Content build/release-notes.txt -TotalCount 1 -Encoding utf8).Trim()
          if ($first -ne $expected) {
            throw "build/release-notes.txt 첫 줄이 $expected 이어야 합니다. 지금은 '$first'입니다."
          }

      - name: 의존성 및 회귀 검사
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm run verify:deep-link
          npm run verify:launch-identity

      - name: Windows 설치본 만들기
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          BWEEP_TEST_BUILD: ${{ steps.version.outputs.test_build }}
        run: |
          npm run package:win -- --publish never
          npm run package:win:test -- --publish never

      - name: GitHub 테스트 릴리스 게시
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}-test.${{ steps.version.outputs.test_build }}'
          $tag = '${{ steps.version.outputs.test_tag }}'
          $assets = @(
            "release-installer-test/Bweeep-Test-Setup-$version.exe",
            "release-installer-test/Bweeep-Test-Setup-$version.exe.blockmap",
            "release-installer-test/test.yml"
          )
          $notes = "지정 테스터용 테스트 런처입니다. 확인이 끝나면 같은 변경을 정식판으로 배포합니다.`n`n" + (Get-Content build/release-notes.txt -Raw -Encoding utf8)
          $notesFile = Join-Path $env:RUNNER_TEMP "test-release-notes.txt"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "붸에엡 테스트 v$version" --notes-file $notesFile

      # 정식판은 초안으로만 올립니다. 초안은 자동 업데이트에 보이지 않으므로,
      # 테스터가 테스트판을 확인한 뒤 "정식 배포" 워크플로로 게시합니다.
      - name: GitHub 정식 릴리스 초안 올리기
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $assets = @(
            "release-installer/Bweeep-Setup-$version.exe",
            "release-installer/Bweeep-Setup-$version.exe.blockmap",
            "release-installer/latest.yml"
          )
          if ('${{ steps.version.outputs.has_draft }}' -eq 'True') {
            # 테스트 중 수정이 병합되면 초안도 마지막 테스트판과 같은 코드로 바꿉니다.
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes-file build/release-notes.txt
          } else {
            gh release create $tag $assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --draft `
              --title "붸에엡 v$version" `
              --notes-file build/release-notes.txt
          }
