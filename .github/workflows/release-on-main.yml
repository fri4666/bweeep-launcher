name: 런처 후보 보관본과 릴리스 초안

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      # 쓰기 토큰을 .git/config에 남기지 않습니다. npm ci가 돌리는 패키지 스크립트가
      # 읽어 갈 수 있기 때문이며, 게시는 GH_TOKEN을 받은 gh 명령만 합니다.
      - name: 소스 내려받기
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 게시된 버전은 건드리지 않습니다. 아직 초안이면 병합할 때마다 후보
      # 보관본과 베타·정식 초안만 갱신하며 자동 업데이트 채널은 게시하지 않습니다.
      - name: 게시 상태 확인
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "package.json 버전 형식이 올바르지 않습니다: $version" }
          $tag = "v$version"
          $PSNativeCommandUseErrorActionPreference = $false
          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,publishedAt 2>$null
          $hasRelease = $LASTEXITCODE -eq 0
          $release = if ($hasRelease) { $releaseJson | ConvertFrom-Json } else { $null }
          $published = $hasRelease -and -not $release.isDraft
          $hasDraft = $hasRelease -and $release.isDraft
          if ($hasDraft -and $release.publishedAt) {
            throw "$tag 는 게시 후 철회된 버전입니다. 기존 설치 파일과 서명 보관본을 덮어쓰지 말고 새 버전 PR을 사용해 주세요."
          }
          $betas = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName --jq ".[].tagName" | Where-Object { $_ -like "$tag-beta.*" })
          $next = 1 + ($betas | ForEach-Object { [int]($_ -replace "^.*-beta\.", "") } | Measure-Object -Maximum).Maximum
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "beta_build=$next" >> $env:GITHUB_OUTPUT
          "beta_tag=$tag-beta.$next" >> $env:GITHUB_OUTPUT
          "published=$published" >> $env:GITHUB_OUTPUT
          "has_draft=$hasDraft" >> $env:GITHUB_OUTPUT
          exit 0

      # 버전을 올릴 때 노트도 함께 고치도록, 첫 줄이 새 버전이 아니면 게시하지 않습니다.
      - name: 릴리스 노트 확인
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          EXPECTED: v${{ steps.version.outputs.version }}
        run: |
          $first = (Get-Content build/release-notes.txt -TotalCount 1 -Encoding utf8).Trim()
          if ($first -ne $env:EXPECTED) {
            throw "build/release-notes.txt 첫 줄이 $env:EXPECTED 이어야 합니다. 지금은 '$first'입니다."
          }

      - name: 의존성 및 회귀 검사
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw 'Full 7-Zip CLI is required to inspect NSIS payloads before upload' }
          "NSIS_SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV
          npm ci
          npm run typecheck
          npm run verify:deep-link
          npm run verify:launch-identity
          node scripts/verify-launcher-update.mjs
          node scripts/verify-file-update.mjs
          node scripts/verify-release-notes.mjs
          node scripts/verify-nsis-codecs.test.mjs

      # x64·ARM64의 정식판과 베타판을 모두 보관본으로만 만듭니다.
      # 실제 설치·자동 업데이트 검증이 끝나기 전에는 어느 채널에도 노출하지 않습니다.
      # 따로 설치하던 "Bweeep Test" 앱은 더 만들지 않습니다(설치본 코드는 그대로 둠).
      - name: Windows 설치본 만들기
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          BWEEP_BETA_BUILD: ${{ steps.version.outputs.beta_build }}
          BWEEP_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.BWEEP_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run package:win -- --publish never
          npm run package:win:beta -- --publish never
          npm run package:win:arm64 -- --publish never
          npm run package:win:beta:arm64 -- --publish never

      - name: 네 설치 파일의 실제 NSIS 압축 코덱 확인
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BETA_VERSION: ${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.beta_build }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sevenZip = $env:NSIS_SEVEN_ZIP
          node scripts/verify-nsis-codecs.mjs "$pwd/release-installer/Bweeep-Setup-$env:VERSION.exe" x64 "$pwd/candidate-proof/stable-x64" $sevenZip
          node scripts/verify-nsis-codecs.mjs "$pwd/release-installer-beta/Bweeep-Setup-$env:BETA_VERSION.exe" x64 "$pwd/candidate-proof/beta-x64" $sevenZip
          node scripts/verify-nsis-codecs.mjs "$pwd/release-installer-arm64/Bweeep-Setup-$env:VERSION-arm64.exe" arm64 "$pwd/candidate-proof/stable-arm64" $sevenZip
          node scripts/verify-nsis-codecs.mjs "$pwd/release-installer-beta-arm64/Bweeep-Setup-$env:BETA_VERSION-arm64.exe" arm64 "$pwd/candidate-proof/beta-arm64" $sevenZip

      - name: 서명된 파일·설치 파일 보관본만 업로드
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BETA_VERSION: ${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.beta_build }}
          BWEEP_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.BWEEP_UPDATE_PUBLIC_KEY_BASE64 }}
          BWEEP_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.BWEEP_UPDATE_SIGNING_KEY_BASE64 }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/create-file-release.mjs release-installer/win-unpacked $env:VERSION stable x64 release-installer/file-update-stable.json
          node scripts/create-file-release.mjs release-installer/win-unpacked $env:VERSION beta x64 release-installer/file-update-beta-channel.json
          node scripts/create-file-release.mjs release-installer-beta/win-unpacked $env:BETA_VERSION beta x64 release-installer-beta/file-update-beta.json
          node scripts/create-file-release.mjs release-installer-arm64/win-arm64-unpacked $env:VERSION stable arm64 release-installer-arm64/file-update-stable-arm64.json
          node scripts/create-file-release.mjs release-installer-arm64/win-arm64-unpacked $env:VERSION beta arm64 release-installer-arm64/file-update-beta-channel-arm64.json
          node scripts/create-file-release.mjs release-installer-beta-arm64/win-arm64-unpacked $env:BETA_VERSION beta arm64 release-installer-beta-arm64/file-update-beta-arm64.json
          node scripts/publish-file-release.mjs release-installer/win-unpacked release-installer/file-update-stable.json files
          node scripts/publish-file-release.mjs release-installer-beta/win-unpacked release-installer-beta/file-update-beta.json files
          node scripts/publish-file-release.mjs release-installer-arm64/win-arm64-unpacked release-installer-arm64/file-update-stable-arm64.json files
          node scripts/publish-file-release.mjs release-installer-beta-arm64/win-arm64-unpacked release-installer-beta-arm64/file-update-beta-arm64.json files
          node scripts/publish-installer.mjs "release-installer/Bweeep-Setup-$env:VERSION.exe" $env:VERSION x64 archive
          node scripts/publish-installer.mjs "release-installer-arm64/Bweeep-Setup-$env:VERSION-arm64.exe" $env:VERSION arm64 archive
          node scripts/publish-installer.mjs "release-installer-beta/Bweeep-Setup-$env:BETA_VERSION.exe" $env:BETA_VERSION x64 archive
          node scripts/publish-installer.mjs "release-installer-beta-arm64/Bweeep-Setup-$env:BETA_VERSION-arm64.exe" $env:BETA_VERSION arm64 archive

      - name: GitHub 베타 릴리스 초안 올리기
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.beta_build }}
          BETA_TAG: ${{ steps.version.outputs.beta_tag }}
        run: |
          $assets = @(
            "release-installer-beta/Bweeep-Setup-$env:BETA_VERSION.exe",
            "release-installer-beta/Bweeep-Setup-$env:BETA_VERSION.exe.blockmap",
            "release-installer-beta/beta.yml",
            "release-installer-beta/file-update-beta.json",
            "release-installer-beta/file-update-x64.bin",
            "release-installer-beta-arm64/file-update-arm64.bin",
            "release-installer-beta-arm64/Bweeep-Setup-$env:BETA_VERSION-arm64.exe",
            "release-installer-beta-arm64/Bweeep-Setup-$env:BETA_VERSION-arm64.exe.blockmap",
            "release-installer-beta-arm64/file-update-beta-arm64.json"
          )
          $notes = "설치와 자동 업데이트를 검증하기 위한 베타 초안이에요. 검증 전에는 다운로드와 자동 업데이트 채널에 게시하지 않아요.`n`n" + (Get-Content build/release-notes.txt -Raw -Encoding utf8)
          $notesFile = Join-Path $env:RUNNER_TEMP "beta-release-notes.txt"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release create $env:BETA_TAG $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "붸에엡 v$env:BETA_VERSION (검증 초안)" --notes-file $notesFile

      # 최종 main 빌드의 실제 검증과 지원 채널 확인 전까지 정식도 초안으로 둡니다.
      - name: GitHub 정식 릴리스 초안 올리기
        if: steps.version.outputs.published != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          HAS_DRAFT: ${{ steps.version.outputs.has_draft }}
        run: |
          $assets = @(
            "release-installer/Bweeep-Setup-$env:VERSION.exe",
            "release-installer/Bweeep-Setup-$env:VERSION.exe.blockmap",
            "release-installer/latest.yml",
            "release-installer/file-update-stable.json",
            "release-installer/file-update-x64.bin",
            "release-installer-arm64/file-update-arm64.bin",
            "release-installer/file-update-beta-channel.json",
            "release-installer-arm64/Bweeep-Setup-$env:VERSION-arm64.exe",
            "release-installer-arm64/Bweeep-Setup-$env:VERSION-arm64.exe.blockmap",
            "release-installer-arm64/file-update-stable-arm64.json",
            "release-installer-arm64/file-update-beta-channel-arm64.json"
          )
          if ($env:HAS_DRAFT -eq 'True') {
            # 테스트 중 수정이 병합되면 초안도 마지막 베타와 같은 코드로 바꿉니다.
            gh release upload $env:TAG $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes-file build/release-notes.txt
          } else {
            gh release create $env:TAG $assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --draft `
              --title "붸에엡 v$env:VERSION" `
              --notes-file build/release-notes.txt
          }

      - name: main 후보의 압축 코덱 검증 증거 보관
        if: always() && steps.version.outputs.published != 'True'
        uses: actions/upload-artifact@v4
        with:
          name: main-release-candidate-proof
          path: candidate-proof/**/*.json
          retention-days: 7
