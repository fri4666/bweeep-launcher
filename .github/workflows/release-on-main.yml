name: 런처 릴리스

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 이미 게시한 버전인지 확인
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "test_tag=v$version-test.1" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT
          exit 0

      - name: 의존성 및 회귀 검사
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm run verify:deep-link
          npm run verify:launch-identity

      - name: Windows 설치본 만들기
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        run: |
          npm run package:win -- --publish never
          npm run package:win:test -- --publish never

      - name: GitHub 테스트 릴리스 게시
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.test_tag }}'
          $assets = @(
            "release-installer-test/Bweeep-Test-Setup-$version.exe",
            "release-installer-test/Bweeep-Test-Setup-$version.exe.blockmap",
            "release-installer-test/test.yml"
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease --title "붸에엡 테스트 v$version" --notes "지정 테스터용 테스트 런처입니다. 설치 뒤에는 테스트 채널 업데이트를 자동으로 내려받고 재시작합니다. Minecraft 서버 설정은 변경하지 않습니다."
          } else {
            gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "붸에엡 테스트 v$version" --notes "지정 테스터용 테스트 런처입니다. 설치 뒤에는 테스트 채널 업데이트를 자동으로 내려받고 재시작합니다. Minecraft 서버 설정은 변경하지 않습니다."
          }

      - name: GitHub 정식 릴리스 게시
        if: steps.version.outputs.exists != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create $tag `
            "release-installer/Bweeep-Setup-$version.exe" `
            "release-installer/Bweeep-Setup-$version.exe.blockmap" `
            "release-installer/latest.yml" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "붸에엡 v$version" `
            --notes "이번 버전은 새 런처 업데이트를 자동으로 내려받아 게임이 실행 중이 아닐 때 재시작합니다. 지정 테스터의 아이콘은 브라우저를 열지 않고 검증된 테스트 런처 설치 파일을 앱 안에서 받아 설치를 시작합니다. Minecraft 서버 설정은 변경하지 않습니다."
