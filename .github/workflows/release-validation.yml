name: 실제 Windows 설치 및 자동 업데이트 검증
on:
  workflow_dispatch:
    inputs:
      mode:
        description: A single mode is diagnostic only; promotion requires All
        required: true
        default: All
        type: choice
        options: [All, FreshNSIS, LegacyBridge, FileBridge]
      target_version:
        description: Candidate version; blank uses package.json
        required: false
        type: string
      staged_candidate:
        description: Validate archived signed candidate without publishing a channel
        required: true
        default: true
        type: boolean
      file_baseline:
        description: Installed baseline for the real file updater
        required: true
        default: 0.1.40-beta.4
        type: string
      update_timeout_minutes:
        description: Actual automatic-update timeout in minutes
        required: true
        default: '15'
        type: string
      stable_installer_sha256:
        description: Reviewed candidate installer SHA-256; required for staged validation
        required: false
        type: string
permissions:
  contents: read
jobs:
  nsis-and-update:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.mode == 'FreshNSIS' && '["FreshNSIS"]' || inputs.mode == 'LegacyBridge' && '["LegacyBridge"]' || inputs.mode == 'FileBridge' && '["FileBridge"]' || '["FreshNSIS","LegacyBridge","FileBridge"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 잠금 파일에 고정된 공식 ASAR 판독기 준비
        run: npm ci --ignore-scripts
      - name: 정식 설치 파일과 실제 자동 업데이트
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STABLE_SHA: ${{ inputs.stable_installer_sha256 }}
          TARGET_VERSION: ${{ inputs.target_version }}
          STAGED_CANDIDATE: ${{ inputs.staged_candidate }}
          FILE_BASELINE: ${{ inputs.file_baseline }}
          UPDATE_TIMEOUT_MINUTES: ${{ inputs.update_timeout_minutes }}
        run: |
          $version = if ($env:TARGET_VERSION) { $env:TARGET_VERSION } else { (Get-Content package.json -Raw | ConvertFrom-Json).version }
          $baseline = if ($env:FILE_BASELINE) { $env:FILE_BASELINE } else { '0.1.40-beta.4' }
          $timeout = if ($env:UPDATE_TIMEOUT_MINUTES) { [int]$env:UPDATE_TIMEOUT_MINUTES } else { 15 }
          $staged = $env:STAGED_CANDIDATE -eq 'true'
          if ($staged -and -not $env:EXPECTED_STABLE_SHA) { throw 'Staged release validation requires the reviewed candidate installer SHA-256' }
          ./scripts/Test-ReleaseOnDisposableWindows.ps1 -Mode '${{ matrix.mode }}' -ExpectedStableVersion $version -ExpectedStableInstallerSha256 $env:EXPECTED_STABLE_SHA -FileBaselineVersion $baseline -UpdateTimeoutMinutes $timeout -StagedCandidate:$staged -InspectorPort 9229
      - name: 실제 교체 도우미의 롤백과 부모 종료 대기
        if: matrix.mode == 'FreshNSIS'
        shell: pwsh
        run: ./scripts/Test-ExactHelper.ps1 -HelperPath './build/file-update-helper.ps1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/bweeep-release-proof-${{ matrix.mode }}/*.json
            ${{ github.workspace }}/scripts/helper-fixture-*/result.json
          retention-days: 7
  protected-medium-token:
    name: 보호 폴더 제약 관찰 (수정 검증 아님)
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 기본 Program Files 권한과 제한된 토큰의 실제 도우미 확인
        shell: pwsh
        run: ./scripts/Test-ProtectedHelperOnRunner.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-medium-token-evidence
          path: ${{ runner.temp }}/bweeep-protected-helper-proof/*.json
          retention-days: 7
