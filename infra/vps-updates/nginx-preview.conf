pid /run/bweeep-update-preview.pid;
error_log /var/log/nginx/bweeep-preview-error.log warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/bweeep-preview-access.log;
  sendfile on;
  server {
    listen 127.0.0.1:18080;
    server_name 158.247.246.225;
    root /srv/bweeep-updates;
    autoindex off;
    disable_symlinks on;
    location /releases/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
  }
}
