limit_conn_zone $binary_remote_addr zone=bweeep_download_clients:10m;
map $status $bweeep_artifact_cache {
  default "no-store";
  200 "public, max-age=31536000, immutable";
  206 "public, max-age=31536000, immutable";
  304 "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name 158.247.246.225;
  location /.well-known/acme-challenge/ { root /var/www/bweeep-acme; }
  location / { return 308 https://158.247.246.225$request_uri; }
}
server {
  listen 443 ssl;
  server_name 158.247.246.225;
  ssl_certificate /etc/letsencrypt/live/158.247.246.225/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/158.247.246.225/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /srv/bweeep-updates;
  autoindex off;
  disable_symlinks on;
  sendfile on;
  access_log /var/log/nginx/bweeep-download-access.log;
  error_log /var/log/nginx/bweeep-download-error.log warn;
  location /releases/ {
    limit_conn bweeep_download_clients 16;
    limit_rate_after 4m;
    limit_rate 4m;
    rewrite ^/releases/(.*)$ /$1 break;
    try_files $uri =404;
    add_header Cache-Control $bweeep_artifact_cache always;
    add_header X-Content-Type-Options nosniff always;
  }
  location / { return 404; }
}
